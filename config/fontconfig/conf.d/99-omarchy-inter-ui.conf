<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- The desktop UI uses Inter, the closest free stand-in for SF Pro.
       Only the Omarchy shell (quickshell) is redirected: the menu bar, the
       menus, the dock and the notifications. Terminals ask for a monospace
       font and keep it. -->
  <match target="pattern">
    <test qual="any" name="prgname">
      <string>quickshell</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Inter</string>
    </edit>
  </match>

  <!-- Apps that ask for a sans get Inter as well. -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Inter</string>
    </edit>
  </match>

  <!-- Nerd Font glyphs keep rendering: the symbols-only font joins the
       Inter family, so the shell's icon glyphs still resolve. -->
  <match target="scan">
    <test name="file">
      <string>/home/artr/.local/share/fonts/nerd-symbols/SymbolsNerdFont-Regular.ttf</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Inter</string>
    </edit>
  </match>
  <!-- Glyphs drawn over the translucent bar fringe in colour with subpixel
       antialiasing, so the shell draws them without it. -->
  <match target="pattern">
    <test qual="any" name="prgname">
      <string>quickshell</string>
    </test>
    <edit name="rgba" mode="assign" binding="strong">
      <const>none</const>
    </edit>
  </match>
</fontconfig>
